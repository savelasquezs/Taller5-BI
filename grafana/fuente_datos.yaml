apiVersion: 1
datasources:
  - name: Taller 5 PostgreSQL
    uid: taller5-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: 127.0.0.1:55439
    user: taller5_bi
    jsonData:
      database: taller5
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: $TALLER5_BI_PASSWORD
    editable: false
