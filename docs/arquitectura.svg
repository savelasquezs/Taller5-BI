<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura local del Taller 5</title>
<desc id="desc">Excel histórico de solo lectura alimenta Python y PostgreSQL dentro de Docker. Grafana consume vistas de lectura. Power BI y DBeaver funcionan en Windows. Una reproducción separada conserva los identificadores reales sin modificar producción.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#24516d"/></marker><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18354b}.title{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:15px}.box{fill:#fff;stroke:#9cb4c4;stroke-width:1.5;rx:10}.line{stroke:#24516d;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1050" height="600" fill="#f5f8fa"/>
<text x="30" y="40" class="title">Taller 5 · despliegue local</text>
<rect x="260" y="70" width="540" height="405" rx="15" fill="#e8f1f6" stroke="#6e9bb6" stroke-dasharray="7 5"/>
<text x="280" y="100" class="label">Docker Compose · red interna</text>
<rect x="25" y="150" width="200" height="105" class="box"/>
<text x="45" y="180" class="label">Excel histórico</text><text x="45" y="207" class="small">Fuente privada 2022–2025</text><text x="45" y="231" class="small">Montaje de solo lectura</text>
<rect x="290" y="150" width="190" height="105" class="box"/>
<text x="310" y="180" class="label">Python · ETL</text><text x="310" y="207" class="small">Carga cada 5 minutos</text><text x="310" y="231" class="small">Validación y huellas</text>
<rect x="550" y="145" width="220" height="125" class="box"/>
<text x="570" y="176" class="label">PostgreSQL 17.6</text><text x="570" y="202" class="small">public: datos e integridad</text><text x="570" y="226" class="small">bi: estrella lógica y KPIs</text><text x="570" y="250" class="small">Volumen persistente</text>
<path class="line" d="M225 203H290"/><path class="line" d="M480 203H550"/>
<rect x="550" y="335" width="220" height="100" class="box"/>
<text x="570" y="365" class="label">Grafana 13.2.3</text><text x="570" y="391" class="small">Tableros y alertas locales</text><text x="570" y="415" class="small">localhost:3002</text>
