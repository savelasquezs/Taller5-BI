<text x="310" y="365" class="label">DEMO opcional</text><text x="310" y="391" class="small">Reproduce IDs reales</text><text x="310" y="415" class="small">Solo demo.eventos</text>
<path class="line" d="M385 335V295H595V270"/>
<rect x="835" y="120" width="190" height="140" class="box"/>
<text x="855" y="150" class="label">Power BI</text><text x="855" y="177" class="small">Aplicación en Windows</text><text x="855" y="202" class="small">DSN Taller5Docker</text><text x="855" y="227" class="small">Importación de vistas bi</text><text x="855" y="249" class="small">Usuario de solo lectura</text>
<path class="line" d="M770 195H835"/>
<rect x="835" y="335" width="190" height="100" class="box"/>
